name: Build & Publish Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Test Suite
        run: npm test

      - name: Build Production Assets
        run: npm run build

      - name: Package Windows Installer & Portable Zip
        run: |
          node scripts/package-windows.mjs
          powershell -NoProfile -Command "Compress-Archive -Path '.\dist-release\VirtualOffice-Portable\*' -DestinationPath '.\The-Virtual-Office-Portable-win64.zip' -Force"

      - name: Upload Release Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VirtualOffice-Setup.exe
            The-Virtual-Office-Portable-win64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
